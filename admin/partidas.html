<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partidas – Tênis de Mesa</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#172033}.topo{background:#111827;color:#fff;padding:18px}.linha{max-width:1220px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.topo h1{margin:0;font-size:25px}.topo p{margin:4px 0 0;color:#cbd5e1}.links{display:flex;gap:8px;flex-wrap:wrap}.link{color:#fff;text-decoration:none;border:1px solid #475569;border-radius:9px;padding:9px 12px}.wrap{max-width:1220px;margin:22px auto;padding:0 15px}.card{background:#fff;border-radius:16px;padding:17px;box-shadow:0 5px 18px rgba(15,23,42,.07)}.filtros{display:flex;gap:9px;flex-wrap:wrap;align-items:end}.campo label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.campo select{padding:10px;border:1px solid #d4dbe5;border-radius:9px;background:#fff;min-width:170px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.escuro{background:#111827;color:#fff}.verde{background:#15803d;color:#fff}.vermelho{background:#b91c1c;color:#fff}.amarelo{background:#d97706;color:#fff}.cinza{background:#e5e7eb;color:#172033}.resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.num{font-size:27px;font-weight:900}.rot{font-size:12px;color:#64748b}.sec{margin-top:18px}.sec h2{margin:0 0 10px}.fila{display:grid;gap:10px}.jogo{display:grid;grid-template-columns:170px 1fr 110px 150px;gap:12px;align-items:center;border:1px solid #e2e8f0;border-radius:13px;padding:13px;background:#fff}.meta{font-size:12px;color:#64748b}.agenda-meta{margin-top:5px;font-size:12px;font-weight:800;color:#334155}.duelo{font-weight:800;font-size:16px}.duelo span{color:#94a3b8;font-weight:500;margin:0 6px}.placar{font-size:22px;font-weight:900;text-align:center}.status{display:inline-block;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}.AGENDADO{background:#e0f2fe;color:#075985}.FINALIZADO{background:#dcfce7;color:#166534}.EM_ANDAMENTO{background:#fef3c7;color:#92400e}.wo{font-size:11px;color:#b45309;font-weight:800}.class-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grupo h3{margin:0 0 8px}.tabela{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;font-size:13px;text-align:center}th{background:#f8fafc}td.nome,th.nome{text-align:left}.classif td{background:#f0fdf4}.tagc{background:#15803d;color:#fff;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:900}.msg{font-weight:800;margin-top:10px}.erro{color:#b91c1c}.sucesso{color:#166534}.modal{position:fixed;inset:0;background:rgba(15,23,42,.65);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}.oculto{display:none!important}.modal-card{width:min(720px,100%);max-height:95vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.modal-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.modal h2{margin:0}.x{border:0;background:#e5e7eb;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}.score-head{display:grid;grid-template-columns:1fr 80px 80px;gap:7px;align-items:center;margin-top:16px}.setrow{display:grid;grid-template-columns:1fr 80px 80px;gap:7px;align-items:center;margin-top:7px}.setrow input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;text-align:center;font-size:18px;font-weight:800}.wo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.regra{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;font-size:13px;margin:12px 0}textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.acoes{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}.toast{position:fixed;right:20px;top:20px;z-index:9999;max-width:440px;padding:15px 18px;border-radius:12px;color:#fff;font-weight:800;box-shadow:0 12px 32px rgba(0,0,0,.22);animation:toastIn .18s ease-out}.toast.sucesso-toast{background:#166534}.toast.erro-toast{background:#b91c1c}.toast.info-toast{background:#1d4ed8}.toast small{display:block;margin-top:4px;font-weight:500;opacity:.9}@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:800px){.resumo{grid-template-columns:1fr 1fr}.jogo{grid-template-columns:1fr}.placar{text-align:left}.class-grid{grid-template-columns:1fr}.wo-grid{grid-template-columns:1fr}.toast{left:14px;right:14px;top:14px;max-width:none}}@media(max-width:480px){.resumo{grid-template-columns:1fr}.score-head,.setrow{grid-template-columns:1fr 72px 72px}}
</style></head><body><!-- GUARDA_PERFIL_FINANCEIRO -->
<script>(async()=>{const t=sessionStorage.getItem('tm_admin_token')||'';if(!t)return;try{const r=await fetch('https://script.google.com/macros/s/AKfycbwYApgJFoSzBfLPuq40TjpVygwgzn6cEa7mEFioWG8SLN7owv2l_uSkvBLvNe2-16yzOg/exec?action=adminSessao&token='+encodeURIComponent(t)+'&_='+Date.now(),{cache:'no-store'}),d=await r.json();if(d.ok&&String(d.usuario?.nivel||'').toUpperCase()==='FINANCEIRO'){location.replace('./financeiro.html');}}catch(_e){}})();</script>
<div id="toast" class="toast oculto"></div>
<header class="topo"><div class="linha"><div><h1>Partidas e Placar</h1><p>Duas partidas por noite • Recreativo e Mesatenistas • duas mesas</p></div><div class="links"><span id="usuarioTopo"></span><a class="link" href="./sorteio.html">Sorteio</a><a class="link" href="./index.html">Painel</a><a class="link" href="../acompanhar.html" target="_blank">Visão dos participantes</a></div></div></header>
<main class="wrap">
<section class="card"><div class="filtros"><div class="campo"><label>Categoria</label><select id="fCat"><option value="">Todas</option><option>Mesatenistas</option><option>Recreativo</option></select></div><div class="campo"><label>Status</label><select id="fStatus"><option value="">Todos</option><option>AGENDADO</option><option>FINALIZADO</option></select></div><button class="btn escuro" onclick="carregar()">Atualizar</button><button id="btnGerarAgenda" class="btn verde" onclick="gerarAgendaAutomatica()">📅 Gerar / atualizar agenda automaticamente</button></div><div class="resumo"><div><div class="num" id="nTotal">0</div><div class="rot">Partidas</div></div><div><div class="num" id="nPend">0</div><div class="rot">Pendentes</div></div><div><div class="num" id="nFim">0</div><div class="rot">Finalizadas</div></div><div><div class="num" id="nGrupos">0</div><div class="rot">Grupos ativos</div></div></div><div id="msg" class="msg"></div></section>
<section class="card sec"><h2>Fila de partidas</h2><div id="fila" class="fila"></div></section>
<section class="sec"><h2>Classificação ao vivo</h2><div id="classificacao" class="class-grid"></div></section>
</main>
<div id="modal" class="modal oculto"><div class="modal-card"><div class="modal-top"><div><h2 id="mTitulo">Partida</h2><div id="mMeta" class="meta"></div></div><button class="x" onclick="fechar()">×</button></div><div id="mRegra" class="regra"></div><div class="score-head"><strong>Set</strong><strong id="nomeAcurto">A</strong><strong id="nomeBcurto">B</strong></div><div id="sets"></div><label style="display:block;margin-top:13px;font-weight:800">Observações</label><textarea id="obs" rows="2" placeholder="Opcional"></textarea><div class="wo-grid"><button class="btn amarelo" onclick="salvarWO('WO_A')">Faltou Jogador A</button><button class="btn amarelo" onclick="salvarWO('WO_B')">Faltou Jogador B</button><button class="btn vermelho" onclick="salvarWO('WO_DUPLO')">Faltaram os dois</button></div><div class="acoes"><button class="btn cinza" onclick="fechar()">Cancelar</button><button id="btnSalvarResultado" class="btn verde" onclick="salvarNormal()">Finalizar resultado</button></div><div id="mMsg" class="msg"></div></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwYApgJFoSzBfLPuq40TjpVygwgzn6cEa7mEFioWG8SLN7owv2l_uSkvBLvNe2-16yzOg/exec';let token=sessionStorage.getItem('tm_admin_token')||'',usuario=null,jogos=[],classif=[],fases=[],atual=null,salvando=false,toastTimer=null;
const post=async o=>{const b=new URLSearchParams(o),r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:b.toString()});return r.json()};
function mostrarToast(texto,tipo='sucesso',tempo=3600){clearTimeout(toastTimer);toast.className='toast '+(tipo==='erro'?'erro-toast':tipo==='info'?'info-toast':'sucesso-toast');toast.innerHTML=texto;toast.classList.remove('oculto');toastTimer=setTimeout(()=>toast.classList.add('oculto'),tempo)}
function bloquearModal(v){salvando=v;document.querySelectorAll('#modal button,#modal input,#modal textarea').forEach(el=>el.disabled=v);if(btnSalvarResultado)btnSalvarResultado.textContent=v?'Salvando...':'Finalizar resultado'}
async function validar(){if(!token)return location.href='./index.html';try{const r=await fetch(API_URL+'?action=adminSessao&token='+encodeURIComponent(token)+'&_='+Date.now(),{cache:'no-store'}),d=await r.json();if(!d.ok)throw 0;usuario=d.usuario;usuarioTopo.textContent=usuario.nome+' • '+usuario.nivel;if(document.getElementById('btnGerarAgenda'))btnGerarAgenda.style.display=usuario.nivel==='ADMINISTRADOR'?'inline-block':'none';carregar()}catch(_){sessionStorage.removeItem('tm_admin_token');location.href='./index.html'}}
async function gerarAgendaAutomatica(){
  if(usuario?.nivel!=='ADMINISTRADOR')return mostrarToast('Apenas o administrador pode recalcular a agenda.','erro',4500);
  if(!jogos.some(j=>j.fase==='GRUPOS'&&j.status!=='FINALIZADO'))return mostrarToast('Não há partidas de grupos pendentes para agendar.','info',4200);
  if(!confirm('Gerar/atualizar a agenda das partidas de grupos? O sistema redistribuirá os jogos pendentes a partir da data de início, de segunda a sexta, ignorando datas bloqueadas e mantendo no máximo 1 Recreativo + 1 Mesatenistas por noite.'))return;
  btnGerarAgenda.disabled=true;
  const texto=btnGerarAgenda.textContent;
  btnGerarAgenda.textContent='Gerando agenda...';
  msg.className='msg';msg.textContent='Gerando agenda automática e conferindo o calendário oficial...';
  mostrarToast('⏳ Gerando agenda automática...<small>Conferindo dias úteis, bloqueios e as duas categorias.</small>','info',15000);
  try{
    const d=await post({action:'adminGerarAgendaAutomatica',token});
    if(!d.ok)throw new Error(d.mensagem||d.erro);
    mostrarToast('✓ '+esc(d.mensagem||'Agenda atualizada com sucesso.'),'sucesso',5000);
    msg.className='msg sucesso';msg.textContent=d.mensagem||'Agenda atualizada com sucesso.';
    await carregar(true);
  }catch(e){
    msg.className='msg erro';msg.textContent=e.message;
    mostrarToast('✕ '+esc(e.message),'erro',6000);
  }finally{
    btnGerarAgenda.disabled=false;
    btnGerarAgenda.textContent=texto;
  }
}
async function carregar(silencioso=false){if(!silencioso){msg.className='msg';msg.textContent='Carregando...'}try{const r=await fetch(API_URL+'?action=jogosAdmin&token='+encodeURIComponent(token)+'&_='+Date.now(),{cache:'no-store'}),d=await r.json();if(!d.ok)throw new Error(d.mensagem||d.erro);jogos=d.jogos||[];classif=d.classificacao||[];fases=d.fasesGrupos||[];render();if(!silencioso)msg.textContent=''}catch(e){msg.className='msg erro';msg.textContent=e.message;if(silencioso)mostrarToast('✕ '+esc(e.message),'erro',5000)}}
function render(){const cat=fCat.value,st=fStatus.value,l=ordenarFila(jogos.filter(j=>(!cat||j.categoria===cat)&&(!st||j.status===st)));nTotal.textContent=l.length;nPend.textContent=l.filter(j=>j.status!=='FINALIZADO').length;nFim.textContent=l.filter(j=>j.status==='FINALIZADO').length;nGrupos.textContent=new Set(l.filter(j=>j.fase==='GRUPOS').map(j=>j.categoria+'|'+j.grupo)).size;fila.innerHTML=l.length?l.map(cardJogo).join(''):'<div class="card">Nenhuma partida encontrada.</div>';renderClassificacao(cat)}
function ordemFase(f){return {GRUPOS:0,DEZESSEIS_AVOS:1,OITAVAS_DE_FINAL:2,QUARTAS_DE_FINAL:3,SEMIFINAL:4,TERCEIRO_LUGAR:5,FINAL:6}[String(f||'').toUpperCase()]??2}
function ordenarFila(lista){return lista.sort((a,b)=>{const da=String(a.data||'9999-12-31'),db=String(b.data||'9999-12-31');if(da!==db)return da.localeCompare(db);const ma=String(a.mesa||''),mb=String(b.mesa||'');if(ma!==mb)return ma.localeCompare(mb);const sa=a.status==='FINALIZADO'?1:0,sb=b.status==='FINALIZADO'?1:0;if(sa!==sb)return sa-sb;const fa=ordemFase(a.fase),fb=ordemFase(b.fase);if(fa!==fb)return fa-fb;return String(a.categoria).localeCompare(String(b.categoria),'pt-BR')||a.rodada-b.rodada||String(a.id).localeCompare(String(b.id))})}
function cardJogo(j){const p=j.status==='FINALIZADO'?j.setsA+' × '+j.setsB:'—';const wo=j.tipoResultado&&j.tipoResultado!=='NORMAL'?'<div class="wo">'+textoWO(j)+'</div>':'';const ag=j.data?`<div class="agenda-meta">📅 ${fmtData(j.data)}${j.mesa?' • '+esc(j.mesa):''}${j.horario?' • '+esc(j.horario):''}</div>`:'<div class="agenda-meta">📅 Data ainda não definida</div>';return `<div class="jogo"><div><b>${esc(j.categoria)}</b><div class="meta">${j.fase==='GRUPOS'?esc(j.grupo)+' • Rodada '+(j.rodada||'-'):nomeFase(j.fase)+' • Confronto '+(j.rodada||'-')} • melhor de ${j.melhorDe}</div>${ag}</div><div class="duelo">${esc(j.jogadorA)} <span>×</span> ${esc(j.jogadorB)}${wo}</div><div class="placar">${p}</div><div><span class="status ${esc(j.status)}">${esc(j.status)}</span><br><button class="btn ${j.status==='FINALIZADO'?'cinza':'escuro'}" style="margin-top:7px" onclick="abrir('${j.id}')">${j.status==='FINALIZADO'?'Corrigir resultado':'Abrir placar'}</button></div></div>`}
function fmtData(v){const s=String(v||'');const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'/'+m[2]+'/'+m[1]:esc(s)}
function nomeFase(f){return {DEZESSEIS_AVOS:'16 avos',OITAVAS_DE_FINAL:'Oitavas de final',QUARTAS_DE_FINAL:'Quartas de final',SEMIFINAL:'Semifinal',TERCEIRO_LUGAR:'3º lugar',FINAL:'Final'}[f]||String(f||'').replaceAll('_',' ')}
function classificacaoDefinitiva(categoria){const f=fases.find(x=>x.categoria===categoria);return !!f&&['PRONTA_ENCERRAR','ENCERRADA'].includes(String(f.status||''))}
function renderClassificacao(cat){const lista=classif.filter(x=>!cat||x.categoria===cat),chaves=[...new Set(lista.map(x=>x.categoria+'|'+x.grupo))];classificacao.innerHTML=chaves.length?chaves.map(k=>{const [c,g]=k.split('|'),ls=lista.filter(x=>x.categoria===c&&x.grupo===g).sort((a,b)=>a.posicao-b.posicao),def=classificacaoDefinitiva(c),rotulo=def?'CLASSIFICADO':'CLASSIFICANDO';return `<div class="card grupo"><h3>${esc(c)} • ${esc(g)}</h3><div class="tabela"><table><thead><tr><th>#</th><th class="nome">Jogador</th><th>J</th><th>V</th><th>D</th><th>SP</th><th>SC</th><th>SS</th><th>PP</th><th>PC</th><th>Saldo</th></tr></thead><tbody>${ls.map(x=>`<tr class="${x.classificado?'classif':''}"><td>${x.posicao}</td><td class="nome"><b>${esc(x.nome)}</b> ${x.classificado?'<span class="tagc">'+rotulo+'</span>':''}</td><td>${x.jogos}</td><td>${x.vitorias}</td><td>${x.derrotas}</td><td>${x.setsPro}</td><td>${x.setsContra}</td><td>${x.saldoSets}</td><td>${x.pontosPro}</td><td>${x.pontosContra}</td><td>${x.saldoPontos}</td></tr>`).join('')}</tbody></table></div></div>`}).join(''):'<div class="card">A classificação aparecerá após a geração dos grupos.</div>'}
function abrir(id){if(salvando)return;atual=jogos.find(x=>x.id===id);if(!atual)return;mTitulo.textContent=atual.jogadorA+' × '+atual.jogadorB;mMeta.textContent=atual.categoria+' • '+(atual.grupo||nomeFase(atual.fase))+' • '+(atual.data?fmtData(atual.data)+' • '+(atual.mesa||''):'sem data')+' • melhor de '+atual.melhorDe;mRegra.textContent=atual.melhorDe===5?'Melhor de 5 sets. Vence quem ganhar 3 sets. Cada set vai a 11, com diferença mínima de 2. W.O. simples e duplo estão disponíveis.':'Melhor de 3 sets. Vence quem ganhar 2 sets. Cada set vai a 11, com diferença mínima de 2.';nomeAcurto.textContent=primeiro(atual.jogadorA);nomeBcurto.textContent=primeiro(atual.jogadorB);const qtd=atual.melhorDe===5?5:3;sets.innerHTML=Array.from({length:qtd},(_,i)=>`<div class="setrow"><b>Set ${i+1}</b><input id="s${i+1}a" type="number" min="0" value="${val(atual.sets[i]?.[0])}"><input id="s${i+1}b" type="number" min="0" value="${val(atual.sets[i]?.[1])}"></div>`).join('');obs.value=atual.observacoes||'';mMsg.textContent='';modal.classList.remove('oculto')}
function salvarNormal(){if(salvando||!atual)return;const p={action:'jogoSalvarResultado',token,idJogo:atual.id,tipoResultado:'NORMAL',observacoes:obs.value};for(let i=1;i<=atual.melhorDe;i++){p['set'+i+'A']=document.getElementById('s'+i+'a')?.value||'';p['set'+i+'B']=document.getElementById('s'+i+'b')?.value||''}enviar(p)}
function salvarWO(tipo){if(salvando||!atual)return;const frase=tipo==='WO_DUPLO'?'Confirmar W.O. duplo? Nenhum jogador receberá vitória.':'Confirmar W.O.? O jogador presente receberá os sets por 11 x 0.';if(!confirm(frase))return;enviar({action:'jogoSalvarResultado',token,idJogo:atual.id,tipoResultado:tipo,observacoes:obs.value})}
async function enviar(p){bloquearModal(true);mMsg.className='msg';mMsg.textContent='Salvando resultado... aguarde.';mostrarToast('⏳ Salvando resultado...<small>O sistema está gravando o placar e recalculando a classificação.</small>','info',10000);try{const d=await post(p);if(!d.ok)throw new Error(d.mensagem||d.erro);const texto=d.mensagem||'Resultado gravado com sucesso.';fechar(true);mostrarToast('✓ '+esc(texto),'sucesso',4200);await carregar(true)}catch(e){mMsg.className='msg erro';mMsg.textContent=e.message;mostrarToast('✕ '+esc(e.message),'erro',5000)}finally{bloquearModal(false)}}
function fechar(forcar=false){if(salvando&&!forcar)return;modal.classList.add('oculto');atual=null}function primeiro(n){return String(n||'').split(' ')[0]}function val(v){return v===0?'0':(v||'')}function textoWO(j){if(j.tipoResultado==='WO_A')return 'W.O. — faltou '+j.jogadorA;if(j.tipoResultado==='WO_B')return 'W.O. — faltou '+j.jogadorB;return 'W.O. duplo'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
fCat.addEventListener('change',render);fStatus.addEventListener('change',render);validar();
</script></body></html>
