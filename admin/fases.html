<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fases e Mata-mata – Tênis de Mesa</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#172033}.topo{background:#111827;color:#fff;padding:19px}.linha{max-width:1120px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.topo h1{margin:0;font-size:25px}.topo p{margin:4px 0 0;color:#cbd5e1}.links{display:flex;gap:8px;flex-wrap:wrap}.link{color:#fff;text-decoration:none;border:1px solid #475569;border-radius:9px;padding:9px 12px}.wrap{max-width:1120px;margin:22px auto;padding:0 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border-radius:15px;padding:17px;box-shadow:0 5px 18px rgba(15,23,42,.07)}h2{margin:0 0 12px}.top{display:flex;justify-content:space-between;gap:8px;align-items:start}.status{font-size:11px;font-weight:900;padding:6px 9px;border-radius:999px;background:#e5e7eb}.meta{font-size:12px;color:#64748b}.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:13px 0}.progress span{display:block;height:100%;background:#15803d}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nums div{background:#f8fafc;border-radius:10px;padding:9px}.nums b{display:block;font-size:20px}.cfg{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:12px}.cfg label{font-size:12px;font-weight:800;display:block}.cfg input{width:90px;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45}.verde{background:#15803d;color:#fff}.azul{background:#1d4ed8;color:#fff}.amarelo{background:#d97706;color:#fff}.cinza{background:#e5e7eb;color:#172033}.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.sec{margin-top:20px}.mata{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{border-top:1px solid #e5e7eb;padding:10px 0}.item:first-of-type{border-top:0}.duelo{font-weight:800}.origem{font-size:11px;color:#64748b}.venc{color:#166534;font-size:12px;font-weight:900;margin-top:3px}.msg{font-weight:800;margin:10px 0}.erro{color:#991b1b}.ok{color:#166534}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;border-radius:12px;padding:14px 16px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.2)}.oculto{display:none!important}@media(max-width:760px){.grid,.mata{grid-template-columns:1fr}.nums{grid-template-columns:1fr 1fr}}
</style></head><body><!-- GUARDA_PERFIL_FINANCEIRO -->
<script>(async()=>{const t=sessionStorage.getItem('tm_admin_token')||'';if(!t)return;try{const r=await fetch('https://script.google.com/macros/s/AKfycbwYApgJFoSzBfLPuq40TjpVygwgzn6cEa7mEFioWG8SLN7owv2l_uSkvBLvNe2-16yzOg/exec?action=adminSessao&token='+encodeURIComponent(t)+'&_='+Date.now(),{cache:'no-store'}),d=await r.json();if(d.ok&&String(d.usuario?.nivel||'').toUpperCase()==='FINANCEIRO'){location.replace('./financeiro.html');}}catch(_e){}})();</script>
<header class="topo"><div class="linha"><div><h1>Fases e Mata-mata</h1><p>Fechamento independente por categoria e geração automática da chave</p></div><div class="links"><span id="usuario"></span><a class="link" href="./partidas.html">Partidas e Placar</a><a class="link" href="../resultado-final.html">🏆 Resultado Final</a><a class="link" href="./index.html">Painel</a><a class="link" href="../acompanhar.html" target="_blank">Visão pública</a></div></div></header>
<main class="wrap"><div id="msg" class="msg"></div><section><h2>Fase de grupos</h2><div id="fases" class="grid"></div></section><section class="sec"><h2>Mata-mata</h2><div id="mata" class="mata"></div></section></main><div id="toast" class="toast oculto"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwYApgJFoSzBfLPuq40TjpVygwgzn6cEa7mEFioWG8SLN7owv2l_uSkvBLvNe2-16yzOg/exec';let token=sessionStorage.getItem('tm_admin_token')||'',user=null,estados=[],chave=[],timer;
const post=async o=>{const b=new URLSearchParams(o),r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:b.toString()});return r.json()};
async function iniciar(){if(!token)return location.href='./index.html';try{const r=await fetch(API_URL+'?action=adminSessao&token='+encodeURIComponent(token)+'&_='+Date.now(),{cache:'no-store'}),d=await r.json();if(!d.ok)throw 0;user=d.usuario;usuario.textContent=user.nome+' • '+user.nivel;carregar()}catch(_){sessionStorage.removeItem('tm_admin_token');location.href='./index.html'}}
async function carregar(){msg.textContent='Atualizando...';try{const r=await fetch(API_URL+'?action=jogosAdmin&token='+encodeURIComponent(token)+'&_='+Date.now(),{cache:'no-store'}),d=await r.json();if(!d.ok)throw new Error(d.mensagem||d.erro);estados=d.fasesGrupos||[];chave=d.mataMata||[];render();msg.textContent=''}catch(e){msg.className='msg erro';msg.textContent=e.message}}
function render(){const admin=user?.nivel==='ADMINISTRADOR';fases.innerHTML=estados.map(f=>{const p=f.totalJogos?Math.round(f.jogosFinalizados/f.totalJogos*100):0,st={SEM_JOGOS:'Sem jogos',EM_ANDAMENTO:'Em andamento',PRONTA_ENCERRAR:'Pronta para encerrar',ENCERRADA:'Encerrada'}[f.status]||f.status;return `<div class="card"><div class="top"><div><h2>${esc(f.categoria)}</h2><div class="meta">A outra categoria não precisa terminar para esta avançar.</div></div><span class="status">${esc(st)}</span></div><div class="progress"><span style="width:${p}%"></span></div><div class="nums"><div><b>${f.jogosFinalizados}/${f.totalJogos}</b><span class="meta">concluídos</span></div><div><b>${f.jogosPendentes}</b><span class="meta">pendentes</span></div><div><b>${f.classificadosPorGrupo}</b><span class="meta">por grupo</span></div></div>${admin&&!f.encerrada?`<div class="cfg"><div><label>Classificados por grupo</label><input id="q-${slug(f.categoria)}" type="number" min="1" max="${f.maxClassificados||99}" value="${f.classificadosPorGrupo}"></div><button class="btn azul" onclick="salvarCfg('${js(f.categoria)}')">Salvar</button></div>`:''}<div class="acoes">${f.podeEncerrar?`<button class="btn verde" onclick="encerrar('${js(f.categoria)}')">Encerrar e gerar mata-mata</button>`:''}${admin&&f.podeReabrir?`<button class="btn amarelo" onclick="reabrir('${js(f.categoria)}')">Reabrir fase</button>`:''}${!f.podeEncerrar&&!f.encerrada?`<button class="btn cinza" disabled>${f.jogosPendentes?f.jogosPendentes+' jogo(s) restante(s)':'Aguardando'}</button>`:''}${f.encerrada?'<b class="ok">Mata-mata gerado</b>':''}</div></div>`}).join('')||'<div class="card">Nenhuma categoria com grupos.</div>';renderChave()}
function renderChave(){const keys=[...new Set(chave.map(x=>x.categoria+'|'+x.fase))];mata.innerHTML=keys.length?keys.map(k=>{const [c,f]=k.split('|'),ls=chave.filter(x=>x.categoria===c&&x.fase===f).sort((a,b)=>a.ordem-b.ordem);return `<div class="card"><h2>${esc(c)} • ${esc(nomeFase(f))}</h2>${ls.map(x=>`<div class="item"><div class="meta">Confronto ${x.ordem} • ${esc(x.status)}</div><div class="duelo">${esc(x.jogadorA)} × ${esc(x.jogadorB||'BYE')}</div><div class="origem">${esc(x.origemA)} × ${esc(x.origemB)}</div>${x.vencedor?`<div class="venc">Vencedor: ${esc(x.vencedor)}</div>`:''}</div>`).join('')}</div>`}).join(''):'<div class="card">A chave será criada quando uma categoria concluir e encerrar todos os jogos de grupo.</div>'}
async function salvarCfg(c){const q=document.getElementById('q-'+slug(c)).value;acao({action:'salvarConfigCategoria',token,categoria:c,classificadosPorGrupo:q},'Configuração salva.')}
async function encerrar(c){if(!confirm('Encerrar a fase de grupos de '+c+' e gerar o mata-mata? A outra categoria continuará normalmente.'))return;acao({action:'faseGruposEncerrar',token,categoria:c},'Fase encerrada e mata-mata gerado.')}
async function reabrir(c){if(!confirm('Reabrir '+c+'? O mata-mata ainda não iniciado será removido para permitir correções.'))return;acao({action:'faseGruposReabrir',token,categoria:c},'Fase reaberta.')}
async function acao(p,fallback){avisar('Processando...');try{const d=await post(p);if(!d.ok)throw new Error(d.mensagem||d.erro);avisar(d.mensagem||fallback,true);await carregar()}catch(e){avisar(e.message,false)}}
function avisar(t,ok){clearTimeout(timer);toast.textContent=t;toast.style.background=ok===true?'#166534':ok===false?'#991b1b':'#111827';toast.classList.remove('oculto');timer=setTimeout(()=>toast.classList.add('oculto'),3500)}
function nomeFase(f){return {DEZESSEIS_AVOS:'16 avos',OITAVAS_DE_FINAL:'Oitavas de final',QUARTAS_DE_FINAL:'Quartas de final',SEMIFINAL:'Semifinal',TERCEIRO_LUGAR:'3º lugar',FINAL:'Final'}[f]||String(f||'').replaceAll('_',' ')}function slug(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'_')}function js(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
iniciar();
</script></body></html>
