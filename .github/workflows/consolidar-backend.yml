name: Consolidar backend final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidar-backend.yml'
      - 'backend/consolidar_backend.py'

permissions:
  contents: write

jobs:
  consolidar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar consolidação
        run: python backend/consolidar_backend.py

      - name: Commitar consolidação
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/Code.gs backend/ARBITRAGEM_AGENDA.gs backend/ENCERRAMENTO_TORNEIO.gs
          git commit -m 'Consolidar backend final do Apps Script'
          git push
