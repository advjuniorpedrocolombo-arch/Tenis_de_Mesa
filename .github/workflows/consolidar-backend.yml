name: Consolidar backend final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidar-backend.yml'
      - 'backend/consolidar_backend.py'
      - 'backend/gerar_pacote_publicacao.py'

permissions:
  contents: write

jobs:
  consolidar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidar backend
        run: python backend/consolidar_backend.py

      - name: Gerar pacote único do Apps Script
        run: python backend/gerar_pacote_publicacao.py

      - name: Commitar consolidação
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/Code.gs backend/ARBITRAGEM_AGENDA.gs backend/ENCERRAMENTO_TORNEIO.gs backend/APPS_SCRIPT_COMPLETO.gs
          git commit -m 'Gerar backend consolidado para publicação'
          git push
