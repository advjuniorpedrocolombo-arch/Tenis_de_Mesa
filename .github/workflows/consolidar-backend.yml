name: Consolidar backend final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidar-backend.yml'
      - 'backend/Code.gs'
      - 'backend/consolidar_backend.py'
      - 'backend/aplicar_financeiro.py'
      - 'backend/reforcar_perfis.py'
      - 'backend/aplicar_agenda_manual.py'
      - 'backend/gerar_pacote_publicacao.py'
      - 'backend/FINANCEIRO.gs'
      - 'backend/ARBITRAGEM_AGENDA.gs'
      - 'backend/INSCRICOES_CRONOGRAMA.gs'
      - 'backend/ENCERRAMENTO_TORNEIO.gs'
      - 'backend/CALENDARIO_REMARCACAO.gs'
      - 'backend/AGENDA_AUTOMATICA.gs'
      - 'admin/*.html'

permissions:
  contents: write

jobs:
  consolidar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidar backend
        run: python backend/consolidar_backend.py

      - name: Aplicar integração financeira
        run: python backend/aplicar_financeiro.py

      - name: Reforçar isolamento de perfis
        run: python backend/reforcar_perfis.py

      - name: Aplicar agenda manual
        run: python backend/aplicar_agenda_manual.py

      - name: Gerar pacote único do Apps Script
        run: python backend/gerar_pacote_publicacao.py

      - name: Commitar consolidação
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/*.html backend/Code.gs backend/FINANCEIRO.gs backend/ARBITRAGEM_AGENDA.gs backend/AGENDA_AUTOMATICA.gs backend/ENCERRAMENTO_TORNEIO.gs backend/APPS_SCRIPT_COMPLETO.gs
          git commit -m 'Gerar backend consolidado para publicação'
          git push
