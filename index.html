<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torneio de Tênis de Mesa – Etec</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f4f6f8;
      color:#1f2937;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .aviso{
      width:min(720px,100%);
      background:#fff;
      border-radius:20px;
      padding:44px 28px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.10);
      border-top:6px solid #b91c1c;
    }
    .icone{font-size:58px;margin-bottom:14px}
    h1{
      margin:0 0 16px;
      color:#b91c1c;
      font-size:clamp(28px,5vw,42px);
      line-height:1.15;
    }
    p{
      margin:0;
      color:#4b5563;
      font-size:clamp(18px,3vw,23px);
      line-height:1.5;
      font-weight:600;
    }
    .sub{
      margin-top:14px;
      font-size:16px;
      color:#6b7280;
      font-weight:400;
    }
  </style>
</head>
<body>
  <main class="aviso">
    <div class="icone" aria-hidden="true">🏓</div>
    <h1>Em breve, novas informações do Torneio</h1>
    <p>Aguardando aprovação da Direção e Coordenação.</p>
    <div class="sub">Torneio de Tênis de Mesa – Etec</div>
  </main>
</body>
</html>
