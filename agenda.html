<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda do Torneio – Tênis de Mesa</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#172033}.topo{background:#991b1b;color:#fff;padding:22px 16px}.linha{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.topo h1{margin:0}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{color:#fff;text-decoration:none;border:1px solid #fecaca;border-radius:9px;padding:9px 12px}.wrap{max-width:1100px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 5px 16px rgba(0,0,0,.06);margin-bottom:12px}.filtros{display:flex;gap:8px;flex-wrap:wrap}.filtros input,.filtros select,.filtros button{padding:10px;border-radius:8px;border:1px solid #d1d5db}.filtros button{background:#991b1b;color:#fff;border:0;font-weight:800;cursor:pointer}.dia h2{margin:0 0 10px}.jogo{display:grid;grid-template-columns:130px 1fr 150px 170px;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #e5e7eb}.jogo:first-of-type{border-top:0}.meta{font-size:12px;color:#64748b}.duelo{font-weight:800}.arb{font-size:13px}.mesa{font-weight:800}.msg{font-weight:800;color:#64748b}.cancelado{background:#fff7ed;border-radius:10px;padding:9px}.remarcado{background:#eff6ff;border-radius:10px;padding:9px}.tag{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:900;background:#e5e7eb}.tag-red{background:#fee2e2;color:#991b1b}.tag-blue{background:#dbeafe;color:#1d4ed8}@media(max-width:720px){.jogo{grid-template-columns:1fr}}</style></head><body><header class="topo"><div class="linha"><div><h1>Agenda do Torneio</h1><div>Datas, horários, mesas, árbitros e remarcações</div></div><div class="links"><a href="./acompanhar.html">Acompanhar</a><a href="./resultado-final.html">Resultado Final</a><a href="./index.html">Início</a></div></div></header><main class="wrap"><section class="card"><div class="filtros"><select id="cat"><option value="">Todas as categorias</option><option>Mesatenistas</option><option>Recreativo</option></select><input id="busca" placeholder="Buscar atleta ou árbitro"><button onclick="render()">Filtrar</button><button onclick="carregar()">Atualizar</button></div><div id="msg" class="msg" style="margin-top:10px"></div></section><div id="lista"></div></main><script>const API_URL='https://script.google.com/macros/s/AKfycbwYApgJFoSzBfLPuq40TjpVygwgzn6cEa7mEFioWG8SLN7owv2l_uSkvBLvNe2-16yzOg/exec';let dados=[];async function carregar(){msg.textContent='Atualizando agenda...';try{const d=await(await fetch(API_URL+'?action=agendaPublica&_='+Date.now(),{cache:'no-store'})).json();if(!d.ok)throw new Error(d.mensagem||d.erro);dados=d.jogos||[];render();msg.textContent='Agenda atualizada.'}catch(e){msg.textContent='Não foi possível carregar: '+e.message}}function render(){const c=cat.value,t=(busca.value||'').toLowerCase().trim();let l=dados.filter(j=>j.data&&(!c||j.categoria===c)&&(!t||[j.jogadorA,j.jogadorB,j.arbitro].some(v=>String(v||'').toLowerCase().includes(t))));l.sort((a,b)=>ordData(a.data)-ordData(b.data)||String(a.horario||'').localeCompare(String(b.horario||''))||String(a.mesa||'').localeCompare(String(b.mesa||'')));const dias=[...new Set(l.map(j=>j.data))];lista.innerHTML=dias.length?dias.map(d=>`<section class="card dia"><h2>${esc(formataData(d))}</h2>${l.filter(j=>j.data===d).map(cardJogo).join('')}</section>`).join(''):'<section class="card">Ainda não há partidas com data publicada.</section>'}function cardJogo(j){const cancel=j.status==='CANCELADA_PARA_REMARCACAO',rem=j.status==='REMARCADA'||Number(j.qtdRemarcacoes||0)>0,cls=cancel?'cancelado':rem?'remarcado':'';let extra='';if(cancel)extra=`<div class="meta"><b>Cancelada por força maior:</b> ${esc(j.motivoCancelamento||'motivo informado pela organização')}. Aguardando nova data.</div>`;else if(rem)extra=`<div class="meta"><span class="tag tag-blue">REMARCADA</span>${j.dataAnterior?' Data anterior: '+esc(formataData(j.dataAnterior))+' '+esc(j.horarioAnterior||''):''}</div>`;return `<div class="jogo ${cls}"><div><div class="mesa">${esc(j.horario||'Horário a definir')}</div><div class="meta">${esc(j.mesa?'Mesa '+j.mesa:'Mesa a definir')}</div></div><div><div class="duelo">${esc(j.jogadorA)} × ${esc(j.jogadorB)}</div><div class="meta">${esc(j.categoria)} • ${esc(nomeFase(j.fase))}${j.grupo?' • '+esc(j.grupo):''}</div>${extra}</div><div class="arb"><b>Árbitro</b><br>${esc(j.arbitro||'A definir')}</div><div>${cancel?'<span class="tag tag-red">AGUARDA REMARCAÇÃO</span>':'<b>'+esc(j.status)+'</b>'}</div></div>`}function ordData(v){const s=String(v||'');if(/^\d{4}-/.test(s))return new Date(s+'T00:00:00').getTime();const m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?new Date(m[3]+'-'+m[2]+'-'+m[1]+'T00:00:00').getTime():9e15}function formataData(v){const s=String(v||'');if(/^\d{4}-\d{2}-\d{2}$/.test(s)){const [a,m,d]=s.split('-');return d+'/'+m+'/'+a}return s}function nomeFase(f){return {GRUPOS:'Fase de grupos',SEMIFINAL:'Semifinal',TERCEIRO_LUGAR:'3º lugar',FINAL:'Final',QUARTAS_DE_FINAL:'Quartas de final',OITAVAS_DE_FINAL:'Oitavas de final'}[f]||String(f||'').replaceAll('_',' ')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}busca.addEventListener('input',render);cat.addEventListener('change',render);carregar();setInterval(carregar,60000);</script></body></html>
