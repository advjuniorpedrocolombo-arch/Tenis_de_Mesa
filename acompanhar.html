<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar Torneio – Tênis de Mesa</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#172033}.topo{background:#991b1b;color:#fff;padding:22px 16px}.linha{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.topo h1{margin:0;font-size:27px}.topo p{margin:5px 0 0;color:#fee2e2}.link{color:#fff;text-decoration:none;border:1px solid #fecaca;border-radius:9px;padding:9px 12px}.wrap{max-width:1100px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:15px;padding:16px;box-shadow:0 5px 16px rgba(0,0,0,.06)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e5e7eb}.tabs .ativo{background:#991b1b;color:#fff}.sec{margin-top:18px}.sec h2{margin:0 0 11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grupo h3{margin:0 0 9px}.lista{margin:0;padding:0;list-style:none}.lista li{padding:8px 0;border-bottom:1px solid #eee}.tag{font-size:10px;font-weight:900;background:#dbeafe;color:#1d4ed8;border-radius:999px;padding:3px 6px}.tabela{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:center;font-size:13px}th{background:#f8fafc}.nome{text-align:left}.classif{background:#f0fdf4}.verde{color:#166534;font-weight:900}.jogos{display:grid;gap:9px}.jogo{display:grid;grid-template-columns:120px 1fr 80px;gap:10px;align-items:center;padding:12px;border:1px solid #e5e7eb;border-radius:12px}.meta{font-size:12px;color:#64748b}.duelo{font-weight:800}.placar{font-size:20px;font-weight:900;text-align:center}.wo{font-size:11px;color:#b45309;font-weight:800}.msg{font-weight:800;color:#64748b}@media(max-width:720px){.grid{grid-template-columns:1fr}.jogo{grid-template-columns:1fr}.placar{text-align:left}}
</style></head><body>
<header class="topo"><div class="linha"><div><h1>Acompanhe o Torneio</h1><p>Grupos, partidas e classificação em tempo real</p></div><a class="link" href="./index.html">Inscrição / início</a></div></header>
<main class="wrap"><section class="card"><div class="tabs"><button id="tTodas" class="ativo" onclick="setCat('')">Todas</button><button id="tMes" onclick="setCat('Mesatenistas')">Mesatenistas</button><button id="tRec" onclick="setCat('Recreativo')">Recreativo</button><button onclick="carregar()">Atualizar</button></div><div id="msg" class="msg" style="margin-top:10px"></div></section>
<section class="sec"><h2>Classificação ao vivo</h2><div id="classificacao" class="grid"></div></section>
<section class="sec"><h2>Partidas</h2><div id="jogos" class="jogos"></div></section>
<section class="sec"><h2>Grupos</h2><div id="grupos" class="grid"></div></section></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwYApgJFoSzBfLPuq40TjpVygwgzn6cEa7mEFioWG8SLN7owv2l_uSkvBLvNe2-16yzOg/exec';let dados={jogos:[],classificacao:[],grupos:[]},cat='';
async function carregar(){msg.textContent='Atualizando...';try{const r=await fetch(API_URL+'?action=torneioPublico&_='+Date.now(),{cache:'no-store'}),d=await r.json();if(!d.ok)throw new Error(d.mensagem||d.erro);dados=d;render();msg.textContent='Atualizado agora.'}catch(e){msg.textContent='Não foi possível atualizar: '+e.message}}
function setCat(c){cat=c;tTodas.classList.toggle('ativo',!c);tMes.classList.toggle('ativo',c==='Mesatenistas');tRec.classList.toggle('ativo',c==='Recreativo');render()}
function render(){renderClass();renderJogos();renderGrupos()}
function renderClass(){const l=(dados.classificacao||[]).filter(x=>!cat||x.categoria===cat),ch=[...new Set(l.map(x=>x.categoria+'|'+x.grupo))];classificacao.innerHTML=ch.length?ch.map(k=>{const [c,g]=k.split('|'),ls=l.filter(x=>x.categoria===c&&x.grupo===g).sort((a,b)=>a.posicao-b.posicao);return `<div class="card grupo"><h3>${esc(c)} • ${esc(g)}</h3><div class="tabela"><table><thead><tr><th>#</th><th class="nome">Jogador</th><th>J</th><th>V</th><th>SS</th><th>Saldo pts</th></tr></thead><tbody>${ls.map(x=>`<tr class="${x.classificado?'classif':''}"><td>${x.posicao}</td><td class="nome"><b>${esc(x.nome)}</b>${x.classificado?' <span class="verde">• classificando</span>':''}</td><td>${x.jogos}</td><td>${x.vitorias}</td><td>${x.saldoSets}</td><td>${x.saldoPontos}</td></tr>`).join('')}</tbody></table></div></div>`}).join(''):'<div class="card">A classificação aparecerá quando os grupos forem finalizados.</div>'}
function renderJogos(){const l=(dados.jogos||[]).filter(x=>!cat||x.categoria===cat).sort((a,b)=>(a.status==='FINALIZADO'?1:0)-(b.status==='FINALIZADO'?1:0)||String(a.categoria).localeCompare(String(b.categoria))||String(a.grupo).localeCompare(String(b.grupo))||a.rodada-b.rodada);jogos.innerHTML=l.length?l.map(j=>`<div class="card jogo"><div><b>${esc(j.categoria)}</b><div class="meta">${esc(j.grupo||j.fase)} • Rodada ${j.rodada||'-'} • melhor de ${j.melhorDe}</div></div><div class="duelo">${esc(j.jogadorA)} × ${esc(j.jogadorB)}${j.tipoResultado&&j.tipoResultado!=='NORMAL'?'<div class="wo">'+textoWO(j)+'</div>':''}</div><div class="placar">${j.status==='FINALIZADO'?j.setsA+' × '+j.setsB:'—'}</div></div>`).join(''):'<div class="card">As partidas aparecerão após o sorteio dos grupos.</div>'}
function renderGrupos(){const l=(dados.grupos||[]).filter(x=>!cat||x.categoria===cat);grupos.innerHTML=l.length?l.map(g=>`<div class="card grupo"><h3>${esc(g.categoria)} • ${esc(g.grupo)}</h3><ul class="lista">${g.participantes.map(p=>`<li>${esc(p.nome)} ${p.cabecaDeChave?'<span class="tag">CABEÇA</span>':''}</li>`).join('')}</ul></div>`).join(''):'<div class="card">Os grupos ainda não foram publicados.</div>'}
function textoWO(j){if(j.tipoResultado==='WO_A')return 'W.O. — faltou '+esc(j.jogadorA);if(j.tipoResultado==='WO_B')return 'W.O. — faltou '+esc(j.jogadorB);return 'W.O. duplo'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
carregar();setInterval(carregar,30000);
</script></body></html>
