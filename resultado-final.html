<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Resultado Final – Torneio de Tênis de Mesa</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#172033}.topo{background:#991b1b;color:#fff;padding:24px 16px}.linha{max-width:1120px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.topo h1{margin:0;font-size:29px}.topo p{margin:5px 0 0;color:#fee2e2}.acoes{display:flex;gap:8px;flex-wrap:wrap}.btn,.link{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}.btn{background:#fff;color:#991b1b}.link{color:#fff;border:1px solid #fecaca}.wrap{max-width:1120px;margin:22px auto;padding:0 14px}.filtros{background:#fff;border-radius:15px;padding:14px;box-shadow:0 5px 16px rgba(0,0,0,.06);display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filtros button{border:0;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer;background:#e5e7eb}.filtros button.ativo{background:#991b1b;color:#fff}.msg{font-weight:800;color:#64748b;margin-left:auto}.categoria{margin-top:22px;break-inside:avoid}.titulo-cat{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:12px}.titulo-cat h2{margin:0;font-size:26px}.estado{font-size:12px;font-weight:900;padding:6px 9px;border-radius:999px;background:#e5e7eb}.podio-card{background:#fff;border-radius:18px;padding:22px 18px 12px;box-shadow:0 6px 20px rgba(0,0,0,.07);overflow:hidden}.podio{display:flex;align-items:flex-end;justify-content:center;gap:12px;min-height:285px}.lugar{width:min(29%,260px);text-align:center}.medalha{font-size:36px}.nome{font-weight:900;font-size:17px;margin:6px 0 10px;min-height:40px;display:flex;align-items:end;justify-content:center}.degrau{border-radius:14px 14px 0 0;padding:15px 8px 10px;font-weight:900;color:#111827;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 1px rgba(255,255,255,.6)}.p1 .degrau{height:155px;background:#fde68a}.p2 .degrau{height:112px;background:#e5e7eb}.p3 .degrau{height:84px;background:#fed7aa}.pos{font-size:38px;line-height:1}.rot{font-size:12px;margin-top:5px}.aguarda{padding:35px;text-align:center;color:#64748b;font-weight:800}.card{background:#fff;border-radius:15px;padding:17px;box-shadow:0 5px 16px rgba(0,0,0,.06);margin-top:16px}.card h3{margin:0 0 12px}.tabela{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px 8px;border-bottom:1px solid #e5e7eb;text-align:center;font-size:13px}th{background:#f8fafc}.esq{text-align:left}.top1 td{background:#fffbeb}.top2 td{background:#f8fafc}.top3 td{background:#fff7ed}.fase{font-size:11px;font-weight:800;color:#64748b}.legenda{font-size:12px;color:#64748b;margin-top:10px}.rodape{margin:28px 0;text-align:center;color:#64748b;font-size:12px}@media(max-width:700px){.msg{width:100%;margin-left:0}.podio{gap:5px}.lugar{width:33%}.nome{font-size:13px}.medalha{font-size:29px}.p1 .degrau{height:135px}.p2 .degrau{height:100px}.p3 .degrau{height:78px}.pos{font-size:30px}}@media print{body{background:#fff}.topo{background:#fff!important;color:#000;padding:0 0 12px;border-bottom:2px solid #000}.topo p{color:#333}.acoes,.filtros{display:none!important}.wrap{max-width:none;margin:12px 0;padding:0}.categoria{page-break-inside:avoid;margin-top:16px}.podio-card,.card{box-shadow:none;border:1px solid #d1d5db}.rodape{margin-top:15px}.titulo-cat h2{font-size:22px}table{min-width:0}th,td{font-size:11px;padding:7px 5px}}
</style>
</head>
<body>
<header class="topo"><div class="linha"><div><h1>Resultado Final</h1><p>Torneio de Tênis de Mesa – pódio e classificação geral</p></div><div class="acoes"><button class="btn" onclick="window.print()">🖨️ Imprimir / Salvar em PDF</button><a class="link" href="./acompanhar.html">Acompanhar torneio</a><a class="link" href="./index.html">Início</a></div></div></header>
<main class="wrap">
<section class="filtros"><button id="btTodas" class="ativo" onclick="setCat('')">Todas</button><button id="btMes" onclick="setCat('Mesatenistas')">Mesatenistas</button><button id="btRec" onclick="setCat('Recreativo')">Recreativo</button><button onclick="carregar()">Atualizar</button><span id="msg" class="msg">Carregando...</span></section>
<div id="conteudo"></div>
<div class="rodape">Classificação geral calculada pela etapa alcançada no torneio e, entre participantes eliminados na mesma etapa, pelo desempenho na fase de grupos.</div>
</main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwYApgJFoSzBfLPuq40TjpVygwgzn6cEa7mEFioWG8SLN7owv2l_uSkvBLvNe2-16yzOg/exec';
let dados={jogos:[],classificacao:[],grupos:[],fasesGrupos:[],mataMata:[]},cat='';
async function carregar(){msg.textContent='Atualizando...';try{const r=await fetch(API_URL+'?action=torneioPublico&_='+Date.now(),{cache:'no-store'}),d=await r.json();if(!d.ok)throw new Error(d.mensagem||d.erro);dados=d;render();msg.textContent='Atualizado.'}catch(e){msg.textContent='Erro: '+e.message}}
function setCat(c){cat=c;btTodas.classList.toggle('ativo',!c);btMes.classList.toggle('ativo',c==='Mesatenistas');btRec.classList.toggle('ativo',c==='Recreativo');render()}
function render(){const cats=['Mesatenistas','Recreativo'].filter(c=>!cat||c===cat);conteudo.innerHTML=cats.map(renderCategoria).join('')}
function renderCategoria(c){const ranking=rankingCategoria(c),pod=podioCategoria(c),finalizada=!!pod[0]&&!!pod[1]&&!!pod[2];return `<section class="categoria"><div class="titulo-cat"><h2>${esc(c)}</h2><span class="estado">${finalizada?'RESULTADO FINAL':'RESULTADO EM FORMAÇÃO'}</span></div><div class="podio-card">${renderPodio(pod)}</div><div class="card"><h3>Classificação geral – ${esc(c)}</h3>${renderTabela(ranking)}<div class="legenda">Critério: colocação final definida pelas fases eliminatórias. Empates de etapa são ordenados pela colocação no grupo, vitórias, saldo de sets, saldo de pontos, sets vencidos e pontos marcados.</div></div></section>`}
function podioCategoria(c){const mm=(dados.mataMata||[]).filter(x=>x.categoria===c),f=mm.find(x=>x.fase==='FINAL'&&['FINALIZADO','BYE'].includes(x.status)),t=mm.find(x=>x.fase==='TERCEIRO_LUGAR'&&['FINALIZADO','BYE'].includes(x.status));return [f?.vencedor||'',f?.perdedor||'',t?.vencedor||'']}
function renderPodio(p){if(!p.some(Boolean))return '<div class="aguarda">O pódio será preenchido automaticamente quando as partidas decisivas forem concluídas.</div>';return `<div class="podio"><div class="lugar p2"><div class="medalha">🥈</div><div class="nome">${esc(p[1]||'A definir')}</div><div class="degrau"><div class="pos">2º</div><div class="rot">VICE-CAMPEÃO</div></div></div><div class="lugar p1"><div class="medalha">🥇</div><div class="nome">${esc(p[0]||'A definir')}</div><div class="degrau"><div class="pos">1º</div><div class="rot">CAMPEÃO</div></div></div><div class="lugar p3"><div class="medalha">🥉</div><div class="nome">${esc(p[2]||'A definir')}</div><div class="degrau"><div class="pos">3º</div><div class="rot">TERCEIRO LUGAR</div></div></div></div>`}
function rankingCategoria(c){const base=(dados.classificacao||[]).filter(x=>x.categoria===c).map(x=>({...x}));if(!base.length)return [];const mm=(dados.mataMata||[]).filter(x=>x.categoria===c);const final=mm.find(x=>x.fase==='FINAL'&&['FINALIZADO','BYE'].includes(x.status)),terc=mm.find(x=>x.fase==='TERCEIRO_LUGAR'&&['FINALIZADO','BYE'].includes(x.status));const fix=new Map();if(final?.idVencedor)fix.set(String(final.idVencedor),1);if(final?.idPerdedor)fix.set(String(final.idPerdedor),2);if(terc?.idVencedor)fix.set(String(terc.idVencedor),3);if(terc?.idPerdedor)fix.set(String(terc.idPerdedor),4);
 const info=base.map(p=>{const id=String(p.id),part=mm.filter(m=>String(m.idA)===id||String(m.idB)===id),perda=part.filter(m=>String(m.idPerdedor||'')===id).sort((a,b)=>ordFase(b.fase)-ordFase(a.fase))[0],max=part.reduce((n,m)=>Math.max(n,ordFase(m.fase)),0);return {...p,fix:fix.get(id)||0,etapa:perda?ordFase(perda.fase):max,faseLabel:fix.get(id)===1?'Campeão':fix.get(id)===2?'Vice-campeão':fix.get(id)===3?'3º lugar':fix.get(id)===4?'4º lugar':perda?'Eliminado – '+nomeFase(perda.fase):(max?'Classificado ao '+nomeFase(part.sort((a,b)=>ordFase(b.fase)-ordFase(a.fase))[0]?.fase):'Fase de grupos')}});
 const definidos=info.filter(x=>x.fix).sort((a,b)=>a.fix-b.fix),rest=info.filter(x=>!x.fix).sort((a,b)=>b.etapa-a.etapa||a.posicao-b.posicao||b.vitorias-a.vitorias||b.saldoSets-a.saldoSets||b.saldoPontos-a.saldoPontos||b.setsPro-a.setsPro||b.pontosPro-a.pontosPro||String(a.nome).localeCompare(String(b.nome),'pt-BR'));return definidos.concat(rest).map((x,i)=>({...x,geral:i+1}))}
function renderTabela(l){if(!l.length)return '<div class="aguarda">A classificação geral aparecerá após a fase de grupos.</div>';return `<div class="tabela"><table><thead><tr><th>#</th><th class="esq">Participante</th><th>Etapa / situação</th><th>Grupo</th><th>Pos. grupo</th><th>V</th><th>Sets +</th><th>Sets −</th><th>Saldo Sets</th><th>Pontos +</th><th>Pontos −</th><th>Saldo Pontos</th></tr></thead><tbody>${l.map(x=>`<tr class="${x.geral===1?'top1':x.geral===2?'top2':x.geral===3?'top3':''}"><td><b>${x.geral}º</b></td><td class="esq"><b>${esc(x.nome)}</b></td><td><span class="fase">${esc(x.faseLabel)}</span></td><td>${esc(x.grupo)}</td><td>${x.posicao}º</td><td>${x.vitorias}</td><td>${x.setsPro}</td><td>${x.setsContra}</td><td>${x.saldoSets}</td><td>${x.pontosPro}</td><td>${x.pontosContra}</td><td>${x.saldoPontos}</td></tr>`).join('')}</tbody></table></div>`}
function ordFase(f){return {GRUPOS:0,DEZESSEIS_AVOS:1,OITAVAS_DE_FINAL:2,QUARTAS_DE_FINAL:3,SEMIFINAL:4,TERCEIRO_LUGAR:5,FINAL:6}[String(f||'').toUpperCase()]??1}
function nomeFase(f){return {GRUPOS:'fase de grupos',DEZESSEIS_AVOS:'16 avos',OITAVAS_DE_FINAL:'oitavas de final',QUARTAS_DE_FINAL:'quartas de final',SEMIFINAL:'semifinal',TERCEIRO_LUGAR:'disputa de 3º lugar',FINAL:'final'}[String(f||'').toUpperCase()]||String(f||'').replaceAll('_',' ').toLowerCase()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
carregar();
</script>
</body></html>
